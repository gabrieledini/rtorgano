name: Aggiorna organigramma

on:
  workflow_dispatch:        # avvio manuale da GitHub (anche da app mobile)
  schedule:
    - cron: "0 5 * * 1"     # ogni lunedì alle 5:00 UTC

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/crawl.mjs
      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/organigramma.json
          git diff --staged --quiet || (git commit -m "Organigramma aggiornato $(date +%F)" && git push)
